<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Fish Audio Voice Clone">
  <title>Fish Audio Voice Clone</title>
  <defs>
    <!-- 背景：Fish Audio 标志性黑金/珊瑚红沉浸感渐变 -->
    <linearGradient id="fishBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="60%" stop-color="#11141B"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>

    <!-- 珊瑚橙到粉红的声波高光 -->
    <linearGradient id="waveGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5B35"/>
      <stop offset="50%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <!-- 居中环境光晕 -->
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF5B35" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FF7A45" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF5B35" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5B35" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 圆角底板 (符合 MaiBot 卡片风格 rx=30) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fishBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#centerGlow)"/>

  <!-- 环形装饰声圈（增强语音/音频特征） -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#waveGlow)" stroke-width="1.2" opacity="0.25" stroke-dasharray="3 4"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.1"/>

  <!-- Fish Audio 官方鲸鱼声波主体 -->
  <!-- 原始坐标：viewBox 0 0 24 24，放大 3.6 倍居中 -->
  <g transform="translate(20.8, 15.5) scale(3.6)" fill="#FFFFFF" fill-rule="evenodd" filter="url(#softGlow)">
    <path d="M23.556 12.189c.244 0 .444.126.444.28v.951c0 .154-.2.28-.444.28s-.444-.126-.444-.28v-.952c0-.153.2-.279.444-.279zm-1.764.372c.244 0 .444.126.444.28v2.095c0 .153-.2.279-.444.279-.245 0-.444-.126-.444-.28V12.84c0-.153.2-.28.444-.28zm-1.765.434c.244 0 .444.125.444.279v2.355c0 .154-.2.28-.444.28s-.444-.126-.444-.28v-2.355c0-.154.2-.28.444-.28zm-1.764.359c.244 0 .444.125.444.279v2.33c0 .153-.2.279-.444.279s-.444-.126-.444-.28v-2.33c0-.153.2-.278.444-.278zm-1.765.316c.245 0 .444.126.444.28v2.017c0 .154-.2.28-.444.28s-.444-.126-.444-.28V13.95c0-.154.2-.28.444-.28zm-1.755 1.287c.244 0 .444.125.444.28v.64c0 .153-.2.278-.444.278s-.444-.125-.444-.279v-.64c0-.154.2-.28.444-.28z" opacity=".4"/>
    <path d="M23.556 9.63c.244 0 .444.125.444.279v1.575c0 .154-.2.28-.444.28s-.444-.126-.444-.28V9.909c0-.154.2-.28.444-.28zm-1.764-1.058c.244 0 .444.125.444.28v2.81c0 .153-.2.278-.444.278-.245 0-.444-.125-.444-.279v-2.81c0-.154.2-.28.444-.28zm-1.765-.398c.244 0 .444.126.444.28v3.667c0 .153-.2.28-.444.28s-.444-.127-.444-.28V8.453c0-.153.2-.28.444-.28zM18.263 8c.244 0 .444.126.444.28v4.29c0 .154-.2.28-.444.28s-.444-.126-.444-.28V8.28c0-.154.2-.28.444-.28zm-1.765.109c.245 0 .444.126.444.28v4.355c0 .154-.2.28-.444.28s-.444-.126-.444-.28V8.388c0-.153.2-.28.444-.28zm-1.755.273c.244 0 .444.125.444.28v5.434c0 .153-.2.28-.444.28s-.444-.126-.444-.28V8.66c0-.154.2-.28.444-.28zm-1.801.463c.244 0 .444.125.444.279v6.162c0 .154-.2.28-.444.28s-.444-.126-.444-.28V9.124c0-.154.2-.28.444-.28zm-1.764.784c.244 0 .444.126.444.28v5.928c0 .154-.2.28-.444.28-.245 0-.444-.126-.444-.28V9.909c0-.154.2-.28.444-.28zm-1.765 1.022c.245 0 .444.126.444.28v5.161c0 .154-.2.28-.444.28s-.444-.126-.444-.28V10.93c0-.154.2-.28.444-.28zm-1.764.706c.244 0 .444.126.444.28v5.084c0 .153-.2.279-.444.279s-.444-.126-.444-.28v-5.083c0-.154.2-.28.444-.28zm-1.756.585c.245 0 .444.126.444.28v2.705c0 .154-.2.28-.444.28s-.444-.126-.444-.28v-2.706c0-.153.2-.279.444-.279zM4.076 9.304c.244 0 .444.126.444.28v3.771c0 .154-.2.28-.444.28s-.444-.126-.444-.28V9.584c0-.154.2-.28.444-.28zm-1.814.247c.244 0 .443.126.443.28v1.16c0 .153-.2.279-.443.279-.245 0-.444-.126-.444-.28V9.83c0-.153.2-.279.444-.279zM.444 9.395c.244 0 .444.126.444.28v.523c0 .153-.2.279-.444.279S0 10.351 0 10.197v-.522c0-.154.2-.28.444-.28zm5.45-.442c.244 0 .443.126.443.28v.392c0 .154-.2.28-.444.28s-.444-.126-.444-.28v-.393c0-.154.2-.28.444-.28z"/>
  </g>
</svg>
